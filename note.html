<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Square</title>
    <link rel="stylesheet" href="stylesheet/styles.css">
</head>
<body>
    <header class="header">
        <div class="banner-image">
            <img src="images/Vine-banner-image.png" alt="hanging vines">
        </div>
    </header>
    <section class="note-section">
        <div class="note-header">
            <a href="#">
                <div class="back-arrow">
                    <img src="images/RightArrow.svg">
                </div>
            </a>
            <div class="note-location">
                <img src="images/redpin.svg" alt="location icon">
                <h2>The Location</h2>
            </div>
            <a href="#">
                <div class="forward-arrow">
                    <img src="images/RightArrow.svg">
                </div>
            </a>
        </div>
        <div class="note-content">
            <div class="note-title">
                <h3>Example Title</h3>
            </div>
            <div class="note-text">
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Non sunt illo quibusdam maxime numquam reiciendis eum quas! Rem ad illum dolores, ex rerum nulla totam commodi doloribus minus, vero perferendis!</p>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="footer-image">
            <img class="footer-image-vines" src="images/Vine-banner-image.png">
        </div>
    </footer>
</body>
</html>
